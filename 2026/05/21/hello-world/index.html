<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello world </title>
<meta name="description" content="">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:#f5f2f0;color:#303030;line-height:1.7}
.header{padding:40px 20px;text-align:center;color:#303030;
  background-color:#f5f2f0;}
.header h1{font-size:28px;margin-bottom:6px}
.header .meta{opacity:0.8;font-size:14px}
.content{max-width:720px;margin:32px auto;padding:0 20px}
.content h1,.content h2,.content h3{margin:24px 0 12px;color:#303030}
.content p{margin:12px 0}
.content a{color:#e98300}
.content code{background:#e9830011;padding:2px 6px;border-radius:4px;font-size:14px}
.content blockquote{border-left:3px solid #e98300;padding:8px 16px;margin:16px 0;opacity:0.85}
.content ul{padding-left:24px;margin:12px 0}
.content li{margin:4px 0}
.tags{margin:24px 0}
.footer{text-align:center;padding:32px;font-size:12px;opacity:0.5}
</style>
</head>
<body>
<div class="header">
<h1>Hello world </h1>
<div class="meta">2026-05-21</div>
</div>
<div class="content">

<p>Hello world</p>

</div>
<div class="footer">Published with Tell the World</div>
</body>
</html>
